<!-- wp:html -->
<main>
  <section class="dt-hero"><h1>Contact</h1><p>Support / business inquiries</p></section>
  <div class="dt-page">
    <form class="dt-box" style="display:grid;gap:0.75rem" onsubmit="return false;">
      <label style="display:grid;gap:0.3rem;font-weight:600">Name<input style="min-height:44px;padding:0.6rem;border:1px solid #e0e0e0;border-radius:4px"></label>
      <label style="display:grid;gap:0.3rem;font-weight:600">Email<input type="email" style="min-height:44px;padding:0.6rem;border:1px solid #e0e0e0;border-radius:4px"></label>
      <label style="display:grid;gap:0.3rem;font-weight:600">Message<textarea rows="4" style="padding:0.6rem;border:1px solid #e0e0e0;border-radius:4px"></textarea></label>
      <button class="dt-btn" type="submit">Send</button>
    </form>
  </div>
</main>
