<main>
  <div class="cd-page-hero"><h1>Contact</h1><p>Support desk</p></div>
  <div class="cd-content">
    <p>Replace with your live support channels. Temporary: email / Telegram when you confirm.</p>
    <form class="cd-card" style="display:grid;gap:0.85rem" onsubmit="return false;">
      <label style="display:grid;gap:0.3rem;font-weight:700">Name<input style="min-height:44px;padding:0.65rem;border:1px solid #e5e7eb;border-radius:8px"></label>
      <label style="display:grid;gap:0.3rem;font-weight:700">Email<input type="email" style="min-height:44px;padding:0.65rem;border:1px solid #e5e7eb;border-radius:8px"></label>
      <label style="display:grid;gap:0.3rem;font-weight:700">Message<textarea rows="4" style="padding:0.65rem;border:1px solid #e5e7eb;border-radius:8px"></textarea></label>
      <button class="cd-btn cd-btn--purple" type="submit">Send</button>
    </form>
  </div>
</main>
